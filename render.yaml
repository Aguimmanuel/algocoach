# One Render Docker Web Service + an external Neon PostgreSQL database.
# New → Blueprint after pushing the updated source. Deployment guide is in the separate instructions ZIP.
# No secrets or AI credentials are committed here.
services:
  - type: web
    name: algocoach
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt # Choose a region near your Neon database/users.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Full pooled Neon URL; preserve TLS/channel_binding parameters.
      - key: DATABASE_URL
        sync: false
      # Generate once with secrets.token_urlsafe(48); keep across deploys.
      - key: SECRET_KEY
        sync: false
      # Google Auth Platform → Clients → Web application.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Exact registered HTTPS callback, no trailing slash:
      # https://YOUR-SERVICE.onrender.com/api/auth/google/callback
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: RATE_LIMIT_ENABLED
        value: "true"
# Coaching is offline-model-only. Do not add GEMINI_API_KEY/GEMINI_MODEL.
