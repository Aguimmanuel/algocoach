# Render blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: Render dashboard → New → Blueprint → pick this repo.
# Render reads this file and creates the web service. You still type the
# secrets in yourself; they are never stored here.

services:
  - type: web
    name: algocoach
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # 'free' works, but sleeps after 15 min idle and loses the first request to a cold start
    region: frankfurt # closest to Nigeria of Render's regions; change if your users are elsewhere
    healthCheckPath: /api/health
    autoDeploy: true # deploy on every push to the connected branch
    envVars:
      # ----------------------------------------------------------- database
      # Paste the full URI from Aiven, including ?sslmode=require.
      # Aiven hands you a `postgres://` URL; db.py rewrites it to the driver
      # SQLAlchemy 2 expects, so paste it exactly as given.
      - key: DATABASE_URL
        sync: false

      # -------------------------------------------------------------- auth
      # Signs session tokens. Generate one with:
      #   python3 -c "import secrets; print(secrets.token_urlsafe(48))"
      # If this is missing, sessions are invalidated on every deploy.
      - key: SECRET_KEY
        sync: false

      # ---------------------------------------------------------- AI coach
      # Optional. Without it the app runs the offline coach, which still works.
      # https://aistudio.google.com/apikey
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
